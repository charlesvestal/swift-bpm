name: BPTracker
options:
  bundleIdPrefix: com.charlesvestal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  BPMKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
    # A stable signing identity, so macOS remembers privacy permissions
    # across rebuilds (ad-hoc signatures change with every build).
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: J4722B5MJW
targets:
  BPTracker:
    type: application
    platform: macOS
    sources: [App/BPTracker]
    dependencies:
      - package: BPMKit
        product: BPMKit
    entitlements:
      path: App/BPTracker/BPTracker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.serial: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Apple Reminders for measurement weeks (EventKit uses the calendars entitlement).
        com.apple.security.personal-information.calendars: true
        # The Apple Health hand-off folder that the bundled shortcut reads
        # (iCloud Drive › Shortcuts › Blood Pressure), so no folder picker is needed.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Mobile Documents/iCloud~is~workflow~my~workflows/Documents/Blood Pressure/
    info:
      path: App/BPTracker/Info.plist
      properties:
        CFBundleDisplayName: Blood Pressure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: Blood Pressure uses Bluetooth to download readings from your blood pressure monitor.
        NSRemindersFullAccessUsageDescription: Blood Pressure adds measurement-week reminders to a "Blood Pressure" list and ticks them off when your readings arrive.
    settings:
      base:
        PRODUCT_NAME: Blood Pressure
        PRODUCT_BUNDLE_IDENTIFIER: com.charlesvestal.BPTracker
        PRODUCT_MODULE_NAME: BPTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          # Developer ID for distribution outside the App Store; --timestamp is required for notarization.
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # No get-task-allow (debugging) entitlement: notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  BPTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/BPTrackerTests]
    dependencies:
      - target: BPTracker
      - package: BPMKit
        product: BPMKit
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blood Pressure.app/Contents/MacOS/Blood Pressure"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BPTracker:
    build:
      targets:
        BPTracker: all
    test:
      targets: [BPTrackerTests]
